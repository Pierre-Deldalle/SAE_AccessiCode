    <script>
        // Test 13.1.3 - Redirection avec setTimeout
        let redirectTimeout;
        let countdownValue = 10;
        const countdownEl = document.getElementById('countdown');
        const warningEl = document.getElementById('redirectWarning');

        function startRedirectCountdown() {
            countdownValue = 10;
            updateCountdown();
            redirectTimeout = setInterval(() => {
                countdownValue--;
                updateCountdown();
                if (countdownValue <= 0) {
                    clearInterval(redirectTimeout);
                    // window.location.href = "https://example.com/nouvelle-page";
                    console.log('Redirection would happen here');
                }
            }, 1000);
        }

        function updateCountdown() {
            if (countdownEl) countdownEl.textContent = countdownValue;
        }

        // Test 13.1.3 - Redirection immédiate déclenchée par utilisateur
        document.getElementById('userTriggeredRedirect')?.addEventListener('click', (e) => {
            e.preventDefault();
            // window.location.href = "https://example.com/nouvelle-version";
            console.log('Redirection utilisateur déclenchée');
        });

        // Test 13.1.4 - Session timeout
        let sessionTimeout;
        let sessionTimeLeft = 300; // 5 minutes en secondes
        const sessionWarningEl = document.getElementById('sessionWarning');
        const sessionTimeEl = document.getElementById('sessionTime');
        const lastActivityEl = document.getElementById('lastActivity');

        function updateLastActivity() {
            const now = new Date();
            if (lastActivityEl) {
                lastActivityEl.textContent = now.toLocaleTimeString();
            }
        }

        function startSessionTimer() {
            sessionTimeLeft = 300;
            if (sessionWarningEl) sessionWarningEl.style.display = 'block';
            updateSessionDisplay();

            sessionTimeout = setInterval(() => {
                sessionTimeLeft--;
                updateSessionDisplay();
                if (sessionTimeLeft <= 0) {
                    clearInterval(sessionTimeout);
                    // autoLogout();
                    console.log('Auto-logout would happen here');
                }
            }, 1000);
        }

        function updateSessionDisplay() {
            const minutes = Math.floor(sessionTimeLeft / 60);
            const seconds = sessionTimeLeft % 60;
            if (sessionTimeEl) {
                sessionTimeEl.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            }
        }

        // Test 13.1.4 - Auto logout après inactivité
        let idleTimeout;
        const IDLE_LIMIT = 600; // 10 minutes

        function resetIdleTimer() {
            clearTimeout(idleTimeout);
            idleTimeout = setTimeout(() => {
                // autoLogout();
                console.log('Auto-logout par inactivité');
            }, IDLE_LIMIT * 1000);
        }

        // Contrôles utilisateur
        document.getElementById('stopRedirect')?.addEventListener('click', () => {
            clearInterval(redirectTimeout);
            if (warningEl) warningEl.style.display = 'none';
            console.log('Redirection arrêtée par l\'utilisateur');
        });

        document.getElementById('extendRedirect')?.addEventListener('click', () => {
            clearInterval(redirectTimeout);
            countdownValue *= 10;
            startRedirectCountdown();
            console.log('Délai de redirection augmenté 10x');
        });

        document.getElementById('extendSession')?.addEventListener('click', () => {
            sessionTimeLeft += 300; // +5 minutes
            updateSessionDisplay();
            console.log('Session prolongée');
        });

        document.getElementById('keepAlive')?.addEventListener('click', () => {
            sessionTimeLeft = 300; // Reset à 5 minutes
            updateSessionDisplay();
            resetIdleTimer();
            console.log('Session maintenue active');
        });

        document.getElementById('stopRefresh')?.addEventListener('click', () => {
            clearInterval(redirectTimeout);
            clearInterval(sessionTimeout);
            clearTimeout(idleTimeout);
            console.log('Tous les rafraîchissements/timeouts arrêtés');
        });

        document.getElementById('restartRefresh')?.addEventListener('click', () => {
            startRedirectCountdown();
            startSessionTimer();
            resetIdleTimer();
            console.log('Rafraîchissements relancés');
        });

        document.getElementById('increaseInterval')?.addEventListener('click', () => {
            countdownValue *= 10;
            sessionTimeLeft *= 10;
            updateCountdown();
            updateSessionDisplay();
            console.log('Intervalles augmentés 10x');
        });

        document.getElementById('warnBeforeRefresh')?.addEventListener('click', () => {
            // Simulation d'avertissement 20s avant
            console.log('Avertissement 20s avant rafraîchissement activé');
        });

        // Canvas animation (test 13.1.1)
        const canvas = document.getElementById('animationCanvas');
        const ctx = canvas?.getContext('2d');
        let x = 0;

        function animateCanvas() {
            if (!ctx) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'blue';
            ctx.beginPath();
            ctx.arc(x, 75, 20, 0, Math.PI * 2);
            ctx.fill();
            x = (x + 2) % (canvas.width + 40) - 20;
            requestAnimationFrame(animateCanvas);
        }

        // Initialisation
        startRedirectCountdown();
        startSessionTimer();
        resetIdleTimer();
        animateCanvas();
        updateLastActivity();

        // Mise à jour activité utilisateur
        ['click', 'keydown', 'mousemove', 'scroll'].forEach(event => {
            document.addEventListener(event, () => {
                updateLastActivity();
                resetIdleTimer();
            }, { passive: true });
        });
    </script>

    <script>
        // Test 13.7.1 - Canvas animation flash (5 Hz)
        const flashCanvas = document.getElementById('flashCanvas');
        const fctx = flashCanvas?.getContext('2d');
        let flashFrame = 0;

        function animateFlashCanvas() {
            if (!fctx) return;
            flashFrame++;
            // Flash alterné blanc/noir à 5 Hz (chaque 3 frames à 60fps = ~5Hz)
            const isWhite = Math.floor(flashFrame / 6) % 2 === 0;
            fctx.fillStyle = isWhite ? 'white' : 'black';
            fctx.fillRect(0, 0, flashCanvas.width, flashCanvas.height);
            requestAnimationFrame(animateFlashCanvas);
        }

            Orientation actuelle : <span id="currentOrientation">inconnue</span>
        </div>
        <script>
            function updateOrientationDisplay() {
                const el = document.getElementById('currentOrientation');
                if (el) {
                    if (screen.orientation && screen.orientation.type) {
                        el.textContent = screen.orientation.type;
                    } else if (window.orientation !== undefined) {
                        el.textContent = window.orientation === 0 || window.orientation === 180 ? 'portrait' : 'landscape';
                    } else {
                        el.textContent = window.innerHeight > window.innerWidth ? 'portrait' : 'landscape';
                    }
                }
            }
            // Écouteur orientationchange (légitime pour adaptation)
            window.addEventListener('orientationchange', function() {
                console.log('Orientation changée:', screen.orientation?.type || window.orientation);
                setTimeout(updateOrientationDisplay, 100);
            });
            // Aussi écouter resize pour les navigateurs sans orientationchange
            window.addEventListener('resize', updateOrientationDisplay);
            updateOrientationDisplay();
        </script>
        <p><em>Attendu : NEEDS_REVIEW - orientationchange détecté, peut être légitime pour adaptation présentation.</em></p>

        <p>Interface de signature manuscrite ou dessin où l'orientation paysage facilite le tracé :</p>
        <div style="background: #f8f9fa; padding: 1rem; border-radius: 8px; margin: 1rem 0;">
            <label for="signaturePad" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Signez ici :</label>
            <canvas id="signaturePad" width="600" height="200" style="border: 2px solid #ccc; background: white; border-radius: 4px; cursor: crosshair; touch-action: none;"></canvas>
            <div style="margin-top: 0.5rem;">
                <button id="clearSignature" type="button" style="padding: 0.5rem 1rem; margin-right: 0.5rem;">Effacer</button>
                <button id="saveSignature" type="button" style="padding: 0.5rem 1rem;">Enregistrer</button>
            </div>
        </div>
        <script>
            const sigCanvas = document.getElementById('signaturePad');
            const sigCtx = sigCanvas?.getContext('2d');
            let isDrawing = false;
            let lastX = 0, lastY = 0;

            if (sigCanvas && sigCtx) {
                sigCtx.lineWidth = 2;
                sigCtx.lineCap = 'round';
                sigCtx.strokeStyle = '#000';

                function getCoords(e) {
                    const rect = sigCanvas.getBoundingClientRect();
                    if (e.touches) {
                        return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
                    }
                    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
                }

                function startDraw(e) {
                    isDrawing = true;
                    const coords = getCoords(e);
                    lastX = coords.x;
                    lastY = coords.y;
                }

                function draw(e) {
                    if (!isDrawing) return;
                    e.preventDefault();
                    const coords = getCoords(e);
                    sigCtx.beginPath();
                    sigCtx.moveTo(lastX, lastY);
                    sigCtx.lineTo(coords.x, coords.y);
                    sigCtx.stroke();
                    lastX = coords.x;
                    lastY = coords.y;
                }

                function stopDraw() { isDrawing = false; }

                sigCanvas.addEventListener('mousedown', startDraw);
                sigCanvas.addEventListener('mousemove', draw);
                sigCanvas.addEventListener('mouseup', stopDraw);
                sigCanvas.addEventListener('mouseleave', stopDraw);
                sigCanvas.addEventListener('touchstart', startDraw, { passive: false });
                sigCanvas.addEventListener('touchmove', draw, { passive: false });
                sigCanvas.addEventListener('touchend', stopDraw);

                document.getElementById('clearSignature')?.addEventListener('click', () => {
                    sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
                });
            }
        </script>
        <p><em>Attendu : NOT_APPLICABLE - signature/dessin détecté (canvas + label "signez", touch-action:none), orientation essentielle.</em></p>
    </section>
