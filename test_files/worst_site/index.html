<html lang="xx">

    <header>
        <nav>

        <figure>

        <table id="bad-table">
            <thead>
                <tr>
                    <th rowspan="2">Critère</th>
                    <th colspan="2">Résultat</th>
                </tr>
                <tr>
                    <th>Statut</th>
                    <th>Détail</th>

            </thead>
            <tbody>
                <tr>
                    <td>Structure</td>
                    <td>Inconnu</td>
                    <td>Résumé absent</td>
                </tr>
            </tbody>
        </table>

        <form>
            <h2>Formulaire sans intitulé</h2>
            <input id="email" name="email" type="email">
            <button type="submit"></button>
        </form>

        <section>
            <h2></h2>

    <footer>
        <p></p>
