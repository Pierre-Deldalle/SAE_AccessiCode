[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # erreurs pycodestyle
    "F",  # erreurs Pyflakes
    "W",  # avertissements pycodestyle
    "I",  # ordre des imports
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]